<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales App — Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font: 'Figtree', sans-serif;
      --bg: #0d0f14;
      --surface: #13161e;
      --surface-2: #1b1f2b;
      --border: rgba(255, 255, 255, 0.07);
      --text-primary: #f0f2f8;
      --text-secondary: #8a90a8;
      --text-muted: #4a5068;
      --nav-bg: rgba(13, 15, 20, 0.8);
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
    }

    body.light-mode {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: rgba(31, 35, 40, 0.12);
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --text-muted: #8c959f;
      --nav-bg: rgba(255, 255, 255, 0.8);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      transition: background-color var(--transition), color var(--transition);
    }

    .wrapper {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 40px;
    }

    .top-nav {
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .top-nav .wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .theme-toggle-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 5px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <nav class="top-nav">
    <div class="wrapper">
      <div style="font-weight: 700; letter-spacing: -0.02em;">Sales App <span style="color: var(--text-muted)">DS</span></div>
      <div style="display: flex; align-items: center; gap: 32px;">
        <div class="nav-links">
          <a href="design_system.html" class="nav-link active">Foundation</a>
          <a href="component_showcase.html" class="nav-link">Components</a>
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">
          <span id="theme-btn-text">Light Mode</span>
        </button>
      </div>
    </div>
  </nav>

  <script>
    function toggleTheme() {
      const body = document.body;
      const btnText = document.getElementById('theme-btn-text');
      if (body.classList.contains('light-mode')) {
        body.classList.remove('light-mode');
        btnText.textContent = 'Light Mode';
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.add('light-mode');
        btnText.textContent = 'Dark Mode';
        localStorage.setItem('theme', 'light');
      }
    }
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        const btnText = document.getElementById('theme-btn-text');
        if (btnText) btnText.textContent = 'Dark Mode';
      }
    })();
  </script>
</body>

</html>
