<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales App — Component Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        /* ─── Design Tokens (Synced with Foundation) ──────── */
        :root {
            /* Theme Variables - Default (Dark) */
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #21262d;
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f0f6fc;
            --text-secondary: #8b949e;
            --nav-bg: rgba(13, 17, 23, 0.82);

            /* Colors - Primitives (Constant) */
            --blue-1100: #186BCC;
            --blue-1300: #004699;
            --blue-200: #E6F0FF;
            --neutral-1000: #333333;
            --neutral-700: #717171;
            --neutral-400: #C2C2C2;
            --neutral-100: #F3F3F3;
            --red-400: #E50000;
            --white: #FFFFFF;

            /* Semantic Mappings */
            --surface-primary: var(--blue-1100);
            --surface-primary-hover: var(--blue-1300);
            --text-primary-btn: var(--blue-1100);
            --border-primary: var(--blue-1100);
            --border-gray: var(--neutral-700);
            --border-disabled: var(--neutral-400);
            --text-disabled: var(--neutral-400);
            --text-error: var(--red-400);
            --border-error: var(--red-400);

            /* Spacing & Radius */
            --space-04: 4px;
            --space-06: 6px;
            --space-08: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-24: 24px;
            --radius-08: 8px;

            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --surface-2: #f0f2f5;
            --border: rgba(31, 35, 40, 0.15);
            --text-main: #1f2328;
            --text-secondary: #656d76;
            --nav-bg: rgba(255, 255, 255, 0.82);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Figtree', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 100px;
            transition: background-color var(--transition), color var(--transition);
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ─── Navigation ─────────────────────────────────── */
        .top-nav {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .top-nav .wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        .nav-link.active {
            color: #58a6ff;
        }

        /* ─── Hero ───────────────────────────────────────── */
        header {
            padding: 80px 0 60px;
            border-bottom: 1px solid var(--border);
            background: radial-gradient(circle at 50% -20%, rgba(24, 107, 204, 0.1), transparent 70%);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(24, 107, 204, 0.15);
            border: 1px solid rgba(24, 107, 204, 0.3);
            border-radius: 100px;
            color: #58a6ff;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 18px;
            max-width: 600px;
        }

        /* ─── Section ────────────────────────────────────── */
        section {
            padding: 60px 0;
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .section-desc {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 15px;
        }

        /* ─── Controls ───────────────────────────────────── */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* ─── Button Component Matrix ────────────────────── */
        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .variant-group {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .variant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .variant-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .variant-display {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: flex-start;
        }

        /* ─── Actual Button Implementation (MIMIC DART) ─── */
        .app-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            border-radius: var(--radius-08);
            transition: all var(--transition);
            user-select: none;
            white-space: nowrap;
            border: 1px solid transparent;
            gap: var(--space-08);
        }

        /* Sizes */
        .app-button.large {
            height: 48px;
            padding: 0 var(--space-24);
            font-size: 16px;
        }

        .app-button.medium {
            height: 40px;
            padding: 0 var(--space-16);
            font-size: 14px;
        }

        .app-button.small {
            height: 32px;
            padding: 0 var(--space-12);
            font-size: 12px;
        }

        /* Icon-Only Specifics */
        .app-button.icon-only {
            padding: 0;
            width: unset;
        }

        .app-button.large.icon-only {
            width: 48px;
        }

        .app-button.medium.icon-only {
            width: 40px;
        }

        .app-button.small.icon-only {
            width: 32px;
        }

        /* Primary Variant */
        .app-button.primary {
            background-color: var(--surface-primary);
            color: var(--white);
        }

        .app-button.primary.pressed {
            background-color: var(--blue-1300);
        }

        /* Secondary Variant */
        .app-button.secondary {
            background-color: transparent;
            border-color: var(--border-primary);
            color: var(--text-primary-btn);
        }

        .app-button.secondary.pressed {
            background-color: rgba(24, 107, 204, 0.12);
        }

        /* Neutral Variant */
        .app-button.neutral {
            background-color: transparent;
            border-color: var(--border-gray);
            color: var(--text-main);
        }

        .app-button.neutral.pressed {
            background-color: var(--surface-2);
        }

        /* Destructive Variant */
        .app-button.destructive {
            background-color: #FEE2E2;
            color: var(--text-error);
            border: none;
        }

        .app-button.destructive.pressed {
            background-color: #FECACA;
        }

        /* Link Variant */
        .app-button.link {
            background-color: transparent;
            color: var(--text-primary-btn);
            text-decoration: underline;
        }

        /* States */
        .app-button.disabled {
            cursor: not-allowed;
            opacity: 0.5;
            background-color: transparent;
            border-color: var(--border-disabled) !important;
            color: var(--text-disabled) !important;
            text-decoration: none !important;
        }

        /* ─── TextField Implementation (MIMIC DART) ────── */
        .app-text-field-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-06);
            width: 100%;
        }

        .app-text-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        .app-text-field-container {
            display: flex;
            align-items: center;
            height: 44px;
            border: 1px solid var(--neutral-400);
            border-radius: var(--radius-08);
            padding: 0 var(--space-12);
            background-color: var(--surface);
            transition: all var(--transition);
            gap: var(--space-08);
        }

        .app-text-field-container:focus-within,
        .app-text-field-container.focused {
            border-color: var(--neutral-700);
            border-width: 1px;
            outline: none;
        }

        .app-text-field-container input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            height: 100%;
        }

        .app-text-helper {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .app-text-field-group.error .app-text-field-container {
            border-color: var(--border-error);
        }

        .app-text-field-group.disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <div class="wrapper">
            <div style="font-weight: 700; letter-spacing: -0.02em;">Sales App <span
                    style="color: var(--text-secondary)">DS</span></div>
            <div style="display: flex; align-items: center; gap: 32px;">
                <div class="nav-links">
                    <a href="design_system.html" class="nav-link">Foundation</a>
                    <a href="component_showcase.html" class="nav-link active">Components</a>
                </div>
                <button id="theme-toggle" class="app-button secondary small" onclick="toggleTheme()" style="min-width: 100px;">
                    <span id="theme-btn-text">Light Mode</span>
                </button>
            </div>
        </div>
    </nav>
    <header>
        <div class="wrapper">
            <div class="badge">Sales App Components</div>
            <h1>Component Showcase</h1>
            <p>Interactive verification of Flutter components implemented via design tokens.</p>
        </div>
    </header>

    <div class="wrapper">
        <section id="buttons">
            <div class="controls">
                <div class="control-item">
                    <input type="checkbox" id="toggle-disabled" onchange="updateStates()">
                    <label for="toggle-disabled">Show Disabled State</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="toggle-pressed" onchange="updateStates()">
                    <label for="toggle-pressed">Show Pressed State</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="toggle-loading" onchange="updateStates()">
                    <label for="toggle-loading">Show Loading State</label>
                </div>
            </div>

            <div class="component-grid">
                <!-- Example Variant -->
                <div class="variant-group">
                    <div class="variant-header">
                        <span class="variant-name">Primary</span>
                    </div>
                    <div class="variant-display">
                        <button class="app-button primary medium">Medium Primary</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btnText = document.getElementById('theme-btn-text');
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                btnText.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.add('light-mode');
                btnText.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        }
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                const btnText = document.getElementById('theme-btn-text');
                if (btnText) btnText.textContent = 'Dark Mode';
            }
        })();
        function updateStates() {
            const isDisabled = document.getElementById('toggle-disabled').checked;
            document.querySelectorAll('.app-button').forEach(btn => {
                if (isDisabled) btn.classList.add('disabled');
                else btn.classList.remove('disabled');
            });
        }
    </script>
</body>

</html>
