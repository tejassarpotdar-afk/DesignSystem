<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales App Design System</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --text-main: #f0f6fc;
            --text-secondary: #8b949e;
            --primary: #186BCC;
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.light-mode {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --text-main: #1f2328;
            --text-secondary: #656d76;
        }
        body {
            font-family: 'Figtree', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color var(--transition), color var(--transition);
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        h1 { font-size: 48px; margin-bottom: 16px; letter-spacing: -0.04em; }
        p { color: var(--text-secondary); font-size: 18px; margin-bottom: 40px; }
        .links { display: flex; gap: 16px; justify-content: center; }
        .card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 24px 32px;
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            transition: var(--transition);
            flex: 1;
        }
        body.light-mode .card { border-color: rgba(0,0,0,0.1); }
        .card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(24,107,204,0.2); }
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Mode</button>
    <div class="container">
        <h1>Sales App Design System</h1>
        <p>A comprehensive library of design tokens and Flutter components for the Sales App ecosystem.</p>
        <div class="links">
            <a href="design_system.html" class="card">
                <div>Foundation</div>
                <div style="font-size: 12px; font-weight: 400; opacity: 0.6; margin-top: 4px;">Tokens, Type, Spacing</div>
            </a>
            <a href="component_showcase.html" class="card">
                <div>Components</div>
                <div style="font-size: 12px; font-weight: 400; opacity: 0.6; margin-top: 4px;">Buttons, Inputs, Forms</div>
            </a>
        </div>
    </div>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        (function() {
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        })();
    </script>
</body>
</html>
